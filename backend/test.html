<!DOCTYPE html>
<html>
<head>
    <title>PTCL Network Monitor - Test</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #1a1a1a; color: white; }
        .status { color: #4ade80; font-size: 24px; }
        .info { margin: 10px 0; }
    </style>
</head>
<body>
    <h1>PTCL Network Monitor - Network Test</h1>
    <div class="status">✅ Server is Working!</div>
    <div class="info">Time: <span id="time"></span></div>
    <div class="info">Your IP: <span id="ip"></span></div>
    <div class="info">Server: PTCL Network Monitor Backend</div>
    <div class="info">Port: 3001</div>
    
    <script>
        document.getElementById('time').textContent = new Date().toLocaleString();
        document.getElementById('ip').textContent = window.location.hostname;
        
        // Test API connectivity
        fetch('/api/ips')
            .then(response => response.json())
            .then(data => {
                document.body.innerHTML += '<div class="status">✅ API Working! Found ' + data.length + ' IPs</div>';
            })
            .catch(error => {
                document.body.innerHTML += '<div class="status" style="color: red;">❌ API Error: ' + error.message + '</div>';
            });
    </script>
</body>
</html>
